services:
  smartx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartx-api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - smartx-data:/app/App_Data
    restart: unless-stopped

volumes:
  smartx-data:
